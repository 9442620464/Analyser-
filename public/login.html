<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoreBuddy AI — Sign in</title><style>body{font-family:system-ui,sans-serif;background:#f0f3f0;color:#16211d;display:grid;place-items:center;min-height:100vh}.card{background:#fff;border:1px solid #d4d9d2;border-radius:14px;padding:28px;width:min(420px,calc(100% - 32px));box-shadow:0 8px 30px #0000000d}label{display:block;font-size:13px;margin:14px 0 6px}input{width:100%;padding:11px;border:1px solid #cdd3cc;border-radius:8px;box-sizing:border-box}button{margin-top:18px;width:100%;padding:11px;border:0;border-radius:8px;background:#1f8a70;color:white;font-weight:600;cursor:pointer}small{color:#59645c}.error{margin-top:12px;color:#a32d2d;font-size:13px}</style></head><body><div class="card"><h1>StoreBuddy AI</h1><small>Sign in to your store command center.</small><form id="f"><label>Email</label><input name="email" type="email" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button>Sign in</button><div class="error" id="e"></div></form></div><script>f.onsubmit=async(e)=>{e.preventDefault();const body=Object.fromEntries(new FormData(f));const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok)location='/dashboard';else document.querySelector('#e').textContent=(await r.json()).error||'Sign in failed'};</script></body></html>
